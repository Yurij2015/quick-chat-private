name: chat-app

services:
  # PHP Server & Nginx (For HTTP Requests)
  laravelfpm:
    build:
      context: .
      dockerfile: ./docker/common/php-fpm/Dockerfile
      target: production
    image: chat-app-prod-php:latest
    restart: unless-stopped
    volumes:
      - prod-laravel-storage:/var/www/html/storage
      - prod-laravel-public:/var/www/html/public
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - production-network

  # Web Server (Nginx)
  webserver:
    build:
      context: .
      dockerfile: ./docker/production/nginx/Dockerfile
    image: chat-app-prod-web:latest
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8050}:80"
    volumes:
      - prod-laravel-storage:/var/www/html/storage:ro
      - prod-laravel-public:/var/www/html/public:ro
    depends_on:
      - laravelfpm
    networks:
      - production-network

  # Database
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: '${DB_DATABASE}'
      MYSQL_USER: '${DB_USERNAME}'
      MYSQL_PASSWORD: '${DB_PASSWORD}'
      MYSQL_ROOT_PASSWORD: '${DB_PASSWORD}'
      MYSQL_ALLOW_EMPTY_PASSWORD: 'yes'
    volumes:
      - prod-db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -u root -p$${MYSQL_ROOT_PASSWORD} || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 60s
    networks:
      - production-network

  # Redis for queues, cache, and Reverb
  redis:
    image: redis:alpine
    restart: unless-stopped
    volumes:
      - prod-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - production-network

  # Reverb WebSocket Server
  reverb:
    image: chat-app-prod-php:latest
    restart: unless-stopped
    command: php artisan reverb:start --host="0.0.0.0" --port=8080
    ports:
      - "${REVERB_SERVER_PORT:-8051}:8080"
    volumes:
      - prod-laravel-storage:/var/www/html/storage
    depends_on:
      redis:
        condition: service_healthy
      mysql:
        condition: service_healthy
    networks:
      - production-network

  # Queue Worker
  worker:
    image: chat-app-prod-php:latest
    restart: unless-stopped
    command: php artisan queue:work --tries=3 --timeout=90
    volumes:
      - prod-laravel-storage:/var/www/html/storage
    depends_on:
      redis:
        condition: service_healthy
      mysql:
        condition: service_healthy
    networks:
      - production-network

networks:
  production-network:
    driver: bridge

volumes:
  prod-db-data:
    driver: local
  prod-redis-data:
    driver: local
  prod-laravel-storage:
    driver: local
  prod-laravel-public:
    driver: local
